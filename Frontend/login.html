<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | RUNFOLD</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        RUNFOLD
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="catalogue.html">
            Catalogue
        </a>

        <a href="cart.html">
            Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>


<main class="auth-page">

    <section class="auth-card">

        <span class="eyebrow">
            WELCOME BACK
        </span>


        <h1>
            Login
        </h1>


        <p class="auth-subtitle">
            Sign in to manage and track your RUNFOLD orders.
        </p>


        <form id="login-form">


            <label>

                Email

                <input
                    type="email"
                    id="login-email"
                    required
                    autocomplete="email"
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    id="login-password"
                    required
                    autocomplete="current-password"
                >

            </label>


            <div class="auth-links">

                <a href="forgot-password.html">
                    Forgot password?
                </a>

            </div>


            <p
                id="login-message"
                class="auth-message">
            </p>


            <button
                type="submit"
                class="btn btn-primary full-width"
            >
                Login
            </button>


        </form>


        <div class="auth-divider">
            OR
        </div>


        <p class="auth-bottom">

            New to RUNFOLD?

            <a href="register.html">
                Create an account
            </a>

        </p>

    </section>

</main>


<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>

</body>

</html>
