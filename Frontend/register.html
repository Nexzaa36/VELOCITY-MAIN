<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | VELOCITY</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        VELOCITY
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="catalogue.html">
            Catalogue
        </a>

        <a href="cart.html">
            Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>


<main class="auth-page">

    <section class="auth-card">

        <span class="eyebrow">
            JOIN VELOCITY
        </span>


        <h1>
            Create Account
        </h1>


        <p class="auth-subtitle">
            Create your account to track your orders.
        </p>


        <form id="register-form">


            <!-- =========================
                 FULL NAME
            ========================== -->

            <label>

                Full Name

                <input
                    type="text"
                    id="register-name"
                    required
                    autocomplete="name"
                    placeholder="Enter your full name"
                >

            </label>


            <!-- =========================
                 EMAIL
            ========================== -->

            <label>

                Email

                <input
                    type="email"
                    id="register-email"
                    required
                    autocomplete="email"
                    placeholder="Enter your email"
                >

            </label>


            <!-- =========================
                 PASSWORD
            ========================== -->

            <label>

                Password

                <input
                    type="password"
                    id="register-password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                    placeholder="Create a password"
                >

            </label>


            <!-- =========================
                 PASSWORD REQUIREMENTS
            ========================== -->

            <div class="password-hint">

                <div class="password-title">
                    Password requirements
                </div>


                <div
                    class="requirement"
                    id="req-length"
                >

                    <span class="req-icon">
                        ○
                    </span>

                    <span>
                        8+ characters
                    </span>

                </div>


                <div
                    class="requirement"
                    id="req-uppercase"
                >

                    <span class="req-icon">
                        ○
                    </span>

                    <span>
                        1 uppercase letter
                    </span>

                </div>


                <div
                    class="requirement"
                    id="req-number"
                >

                    <span class="req-icon">
                        ○
                    </span>

                    <span>
                        1 number
                    </span>

                </div>


                <div
                    class="requirement"
                    id="req-special"
                >

                    <span class="req-icon">
                        ○
                    </span>

                    <span>
                        1 special character
                    </span>

                </div>

            </div>


            <!-- =========================
                 CONFIRM PASSWORD
            ========================== -->

            <label>

                Confirm Password

                <input
                    type="password"
                    id="register-confirm"
                    minlength="8"
                    required
                    autocomplete="new-password"
                    placeholder="Confirm your password"
                >

            </label>


            <!-- =========================
                 MESSAGE
            ========================== -->

            <p
                id="register-message"
                class="auth-message"
            ></p>


            <!-- =========================
                 SUBMIT
            ========================== -->

            <button
                type="submit"
                class="btn btn-primary full-width"
            >
                Create Account
            </button>


        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </section>

</main>


<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>

</body>

</html>
