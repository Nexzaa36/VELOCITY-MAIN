<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | RUNFOLD</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            RUNFOLD
        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="catalogue.html">
                Catalogue
            </a>

            <a href="cart.html">
                Cart
                <span id="cart-count">
                    0
                </span>
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- =========================================
         RESET PASSWORD
    ========================================== -->

    <main class="auth-page">

        <section class="auth-card">


            <span class="eyebrow">
                ACCOUNT SECURITY
            </span>


            <h1>
                Reset password.
            </h1>


            <p class="auth-subtitle">
                Choose a new password for your account.
            </p>



            <!-- MESSAGE -->

            <div
                id="reset-message"
                class="auth-message"
                aria-live="polite"
            ></div>



            <!-- FORM -->

            <form
                id="reset-password-form"
            >


                <!-- NEW PASSWORD -->

                <div class="form-section">

                    <label for="new-password">
                        New Password
                    </label>


                    <input
                        type="password"
                        id="new-password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                        autocomplete="new-password"
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-section">

                    <label for="confirm-password">
                        Confirm Password
                    </label>


                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                        autocomplete="new-password"
                    >

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="btn btn-primary full-width"
                >
                    Reset Password
                </button>


            </form>



            <!-- DIVIDER -->

            <div class="auth-divider">
                OR
            </div>



            <!-- LOGIN -->

            <div class="auth-bottom">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </div>


        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            RUNFOLD
        </p>

        <span>
            Event-Driven Commerce Fulfilment Platform
        </span>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/app.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/reset-password.js"></script>


</body>

</html>
